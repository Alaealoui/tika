name: Tache 2 tests

on:
  push:
    branches: [tache2]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Build tika-core et ses dependances
        run: mvn -B -pl tika-core -am -DskipTests install
      - name: Tests ajoutes pour la tache 2
        run: mvn -B -pl tika-core test -Dtest='CharsetUtilsGeneratedTest,CharsetUtilsIcuTest,InputStreamDigesterManualTest' -Dsurefire.failIfNoSpecifiedTests=false
      - name: Analyse de mutation pitest
        run: mvn -B -pl tika-core test-compile pitest:mutationCoverage
      - name: Rapport pitest
        uses: actions/upload-artifact@v4
        with:
          name: pit-reports
          path: tika-core/target/pit-reports
