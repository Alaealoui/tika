name: main jdk17 build

# a chaque push or PR 

on:
  pull_request:
    branches: [ main, tache3 ]
    # si le commit modifie que la documentation le workflow ne se lance pas 
    paths-ignore:
      - 'docs/**'
  push:
    branches: [ main, tache3 ]
    paths-ignore:
      - 'docs/**'

jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    # recuperer tout lhistorique pour comparer
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Semgrep
        run: pip install semgrep==1.185.0
      - name: Semgrep, nouvelles vulnerabilites seulement
        run: |
          # Choisir le commit de reference, la base de la PR, ou le commit avant le push
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="$(git rev-parse HEAD~1)"
          fi
          echo "Commit de reference $BASE"
          # Detecter seulement les nouvelles vulnerabilites dans tika-core
          semgrep scan --config p/java --config p/security-audit --config p/findsecbugs --metrics=off --baseline-commit "$BASE" --error tika-core

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: semgrep
    strategy:
      matrix:
        java: [ '17' ]

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'
      - name: Build et tests de tika-core
        run: mvn -B -pl tika-core -am install "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"

      - name: Rickroll si un test echoue
        if: failure()
        uses: ./.github/actions/rickroll
        with:
          raison: 'Un ou plusieurs tests de tika-core ont echoue'
  
